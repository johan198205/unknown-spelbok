      <text x="953" y="607" class="pill" fill="#66e38a" text-anchor="middle">Vinst</text>
      <text x="1148" y="607" class="num" fill="#66e38a" text-anchor="end">+260 kr</text>
      <line x1="28" y1="628" x2="1172" y2="628" stroke="#1b2233" />
    </g>

    <g>
      <text x="52" y="659" class="cell">11 mar</text>
      <circle cx="170" cy="654" r="9" fill="#1b2436" stroke="#2a3346" />
      <circle cx="188" cy="654" r="9" fill="#1b2436" stroke="#2a3346" />
      <text x="208" y="659" class="cell-strong">Färjestad  Frölunda</text>
      <text x="560" y="659" class="cell-strong">2</text>
      <text x="722" y="659" class="cell" text-anchor="end">2.35</text>
      <text x="856" y="659" class="cell" text-anchor="end">250 kr</text>
      <rect x="920" y="642" width="66" height="24" rx="12" fill="#66e38a" fill-opacity="0.14" stroke="#66e38a" stroke-opacity="0.4" />
      <text x="953" y="659" class="pill" fill="#66e38a" text-anchor="middle">Vinst</text>
      <text x="1148" y="659" class="num" fill="#66e38a" text-anchor="end">+338 kr</text>
      <line x1="28" y1="680" x2="1172" y2="680" stroke="#1b2233" />
    </g>

    <g>
      <text x="52" y="711" class="cell">10 mar</text>
      <circle cx="170" cy="706" r="9" fill="#1b2436" stroke="#2a3346" />
      <circle cx="188" cy="706" r="9" fill="#1b2436" stroke="#2a3346" />
      <text x="208" y="711" class="cell-strong">Inter  Napoli</text>
      <text x="560" y="711" class="cell-strong">Under 3.5</text>
      <text x="722" y="711" class="cell" text-anchor="end">1.72</text>
      <text x="856" y="711" class="cell" text-anchor="end">600 kr</text>
      <rect x="920" y="694" width="60" height="24" rx="12" fill="#1b2436" stroke="#2a3346" />
      <text x="950" y="711" class="pill" fill="#aab4c9" text-anchor="middle">Void</text>
      <text x="1148" y="711" class="num" fill="#aab4c9" text-anchor="end">0 kr</text>
      <line x1="28" y1="732" x2="1172" y2="732" stroke="#1b2233" />
    </g>

    <text x="52" y="757" class="cell" fill="#8e99b0">Visar 5 av 312 bokförda spel</text>
    <text x="1148" y="757" class="cell" fill="#8e99b0" text-anchor="end">Filtrera på liga, spelbolag och odds</text>
  </g>
