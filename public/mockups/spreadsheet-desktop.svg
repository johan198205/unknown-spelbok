    <text x="160" y="459" class="head">MATCH</text>
    <text x="560" y="459" class="head">TIPP</text>
    <text x="722" y="459" class="head" text-anchor="end">ODDS</text>
    <text x="856" y="459" class="head" text-anchor="end">INSATS</text>
    <text x="920" y="459" class="head">RESULTAT</text>
