      <text x="560" y="555" class="cell-strong">1</text>
      <text x="722" y="555" class="cell" text-anchor="end">2.10</text>
      <text x="856" y="555" class="cell" text-anchor="end">300 kr</text>
      <rect x="920" y="538" width="74" height="24" rx="12" fill="#ff5c6c" fill-opacity="0.12" stroke="#ff5c6c" stroke-opacity="0.4" />
      <text x="957" y="555" class="pill" fill="#ff8a96" text-anchor="middle">Förlust</text>
      <text x="1148" y="555" class="num" fill="#ff5c6c" text-anchor="end">300 kr</text>
      <line x1="28" y1="576" x2="1172" y2="576" stroke="#1b2233" />
    </g>

    <g>
      <text x="52" y="607" class="cell">11 mar</text>
