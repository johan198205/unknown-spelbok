<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Mockup av ett spreadsheet i Spelbok">
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#66e38a" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#66e38a" stop-opacity="0" />
    </linearGradient>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .label { font-size: 12px; fill: #8e99b0; letter-spacing: 1.4px; }
      .kpi { font-size: 28px; font-weight: 600; }
      .head { font-size: 12px; fill: #8e99b0; letter-spacing: 1.2px; }
      .cell { font-size: 15px; fill: #aab4c9; }
      .cell-strong { font-size: 15px; fill: #e6eaf2; font-weight: 600; }
      .num { font-size: 15px; font-weight: 600; }
      .pill { font-size: 12px; font-weight: 600; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="799" rx="18" fill="#0f1420" stroke="#232b3e" />

  <text x="28" y="42" fill="#e6eaf2" font-size="17" font-weight="700" letter-spacing="2.4">SPELBOK</text>
  <text x="150" y="42" class="cell">Min spelbok · 2026</text>
  <rect x="1108" y="20" width="64" height="28" rx="14" fill="#1b2436" stroke="#2a3346" />
  <text x="1140" y="39" class="pill" fill="#aab4c9" text-anchor="middle">SEK</text>
  <line x1="0" y1="64" x2="1200" y2="64" stroke="#1c2333" />

  <g>
    <rect x="28" y="88" width="271" height="96" rx="12" fill="#131826" stroke="#232b3e" />
    <text x="52" y="118" class="label">NETTO</text>
    <text x="52" y="156" class="kpi" fill="#66e38a">+12 480 kr</text>

    <rect x="319" y="88" width="271" height="96" rx="12" fill="#131826" stroke="#232b3e" />
    <text x="343" y="118" class="label">ROI</text>
    <text x="343" y="156" class="kpi" fill="#66e38a">+14,2 %</text>

    <rect x="610" y="88" width="271" height="96" rx="12" fill="#131826" stroke="#232b3e" />
    <text x="634" y="118" class="label">HITRATE</text>
    <text x="634" y="156" class="kpi" fill="#e6eaf2">54 %</text>

    <rect x="901" y="88" width="271" height="96" rx="12" fill="#131826" stroke="#232b3e" />
    <text x="925" y="118" class="label">BOKFÖRDA SPEL</text>
    <text x="925" y="156" class="kpi" fill="#e6eaf2">312</text>
  </g>

  <g>
    <rect x="28" y="208" width="1144" height="200" rx="12" fill="#131826" stroke="#232b3e" />
    <text x="52" y="238" class="label">ACKUMULERAT NETTO</text>
    <line x1="52" y1="272" x2="1148" y2="272" stroke="#1c2333" />
    <line x1="52" y1="316" x2="1148" y2="316" stroke="#1c2333" />
    <line x1="52" y1="360" x2="1148" y2="360" stroke="#1c2333" />
    <path d="M52 378 L152 366 L252 372 L352 344 L452 350 L552 318 L652 326 L752 296 L852 284 L952 292 L1052 262 L1148 252 L1148 392 L52 392 Z" fill="url(#area)" />
    <path d="M52 378 L152 366 L252 372 L352 344 L452 350 L552 318 L652 326 L752 296 L852 284 L952 292 L1052 262 L1148 252" fill="none" stroke="#66e38a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
    <circle cx="1148" cy="252" r="4.5" fill="#66e38a" />
  </g>

  <g>
    <rect x="28" y="428" width="1144" height="344" rx="12" fill="#131826" stroke="#232b3e" />
