      <rect x="920" y="486" width="66" height="24" rx="12" fill="#66e38a" fill-opacity="0.14" stroke="#66e38a" stroke-opacity="0.4" />
      <text x="953" y="503" class="pill" fill="#66e38a" text-anchor="middle">Vinst</text>
      <text x="1148" y="503" class="num" fill="#66e38a" text-anchor="end">+435 kr</text>
      <line x1="28" y1="524" x2="1172" y2="524" stroke="#1b2233" />
    </g>

    <g>
      <text x="52" y="555" class="cell">12 mar</text>
      <circle cx="170" cy="550" r="9" fill="#1b2436" stroke="#2a3346" />
      <circle cx="188" cy="550" r="9" fill="#1b2436" stroke="#2a3346" />
